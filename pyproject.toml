[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-personal-ai"
version = "0.1.0"
description = "Local modular LLM agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/local_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
