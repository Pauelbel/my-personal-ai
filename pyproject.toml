[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meepo"
version = "2.0.0"
description = "Мипо — локальный ассистент QA-инженера"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "playwright>=1.47,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
meepo = "meepo.main:run"

[tool.hatch.build.targets.wheel]
packages = ["meepo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
