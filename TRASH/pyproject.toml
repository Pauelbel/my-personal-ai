[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-personal-ai"
version = "0.1.0"
description = "Local modular LLM agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.3.0",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
local-agent = "api.main:run"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/agents", "src/api", "src/catalog", "src/config", "src/connectors", "src/core", "src/llm",
    "src/mcp_runtime", "src/memory", "src/projects", "src/qa", "src/sessions", "src/shared", "src/steps", "src/storage",
    "src/tools", "src/wiki",
]

[tool.hatch.build.targets.wheel.force-include]
"src/ui" = "ui"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Ошибки, порядок импортов, типичные баги и устаревший синтаксис; длину строк не проверяем.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]
